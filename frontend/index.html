<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#F5F7FA" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0D171F" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Tranche Guard : vois ta facture STEG et SONEDE avant qu'elle arrive." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/app-icon.svg" />
    <title>Tranche Guard</title>
    <script>
      // Apply the saved theme before first paint (no flash of the wrong theme).
      try {
        var t = localStorage.getItem("tg-theme");
        var dark = t === "dark" || ((!t || t === "system") && matchMedia("(prefers-color-scheme: dark)").matches);
        if (dark) document.documentElement.classList.add("dark");
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
